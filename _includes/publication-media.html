{% if include.publication.media_coverage %}
<p class="pub-card__media"><span>{% if page.lang == 'zh' %}媒体报道：{% else %}Media Coverage:{% endif %}</span>{% for coverage in include.publication.media_coverage %}<a class="media-badge{% if coverage.institution %} media-badge--{{ coverage.institution | escape }}{% endif %}" href="{{ coverage.url | escape }}"><i class="fas fa-university" aria-hidden="true"></i><span>{{ coverage.label | escape }}</span><span class="media-badge__arrow" aria-hidden="true">↗</span></a>{% endfor %}</p>
{% endif %}
